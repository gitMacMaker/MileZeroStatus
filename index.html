<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Status — Mile Zero Studio</title>
<meta name="description" content="Check the live status of your Mile Zero Studio website build.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101014; --panel: #17171c; --panel-2: #1d1d23;
  --line: #2a2a31; --line-soft: #232329;
  --text: #f2f1ec; --dim: #a9a9b0;
  --accent: #57c690; --sign: #2b6e4f;
  --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(87,198,144,0.06), transparent 60%),
    radial-gradient(900px 600px at -15% 40%, rgba(87,198,144,0.035), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 640px; margin: 0 auto; padding: 0 24px; width: 100%; }
a { color: inherit; }

.nav { padding: 26px 0; }
.nav__inner { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--text); }
.nav__inner svg { width: 26px; height: 30px; }
.nav__inner b { font-family: var(--font-display); font-weight: 600; font-size: 16px; }

main { flex: 1; display: flex; align-items: center; padding: 40px 0 80px; }
.card {
  width: 100%; background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: 20px; padding: clamp(28px, 4vw, 48px);
  box-shadow: 0 30px 70px -30px rgba(0,0,0,0.6);
}

/* ---- loading / entry / not-found states ---- */
.msg { text-align: center; padding: 20px 0; }
.msg .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.msg h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin-top: 14px; }
.msg p { margin-top: 14px; color: var(--dim); }
.msg .btn { margin-top: 26px; }

.codeform { margin-top: 28px; display: flex; gap: 10px; }
.codeform input {
  flex: 1; min-width: 0; background: var(--bg); border: 1.5px solid var(--line); border-radius: 999px;
  color: var(--text); font-family: var(--font-body); font-size: 16px; padding: 13px 20px;
  text-align: center; letter-spacing: 0.02em;
}
.codeform input:focus { outline: none; border-color: var(--accent); }
.codeform input::placeholder { color: var(--dim); }
.codeform .btn { padding: 13px 24px; flex: none; }
.entry__err { margin-top: 14px; color: #f2a6a6; font-size: 14px; min-height: 1.4em; }
.back-link { display: inline-block; margin-bottom: 18px; color: var(--dim); font-size: 13.5px; text-decoration: none; border-bottom: 1px solid var(--line); }
.back-link:hover { color: var(--text); }

@media (max-width: 480px) {
  .codeform { flex-direction: column; }
  .codeform .btn { justify-content: center; }
}

/* ---- status card ---- */
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.eyebrow b { color: var(--accent); }
h1.headline { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 4vw, 38px); line-height: 1.12; margin-top: 12px; }
h1.headline em { font-style: italic; color: var(--accent); }

.sign {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--sign); border: 2px solid rgba(255,255,255,0.85); border-radius: 9px;
  padding: 8px 18px 6px; margin: 26px 0 8px;
}
.sign small { font-weight: 600; font-size: 9.5px; letter-spacing: 0.28em; color: #fff; }
.sign b { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.1; color: #fff; }

.now {
  margin-top: 26px; background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 12px; padding: 18px 20px;
}
.now .label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(87,198,144,0.2); animation: liveDot 2.4s ease-in-out infinite; }
@keyframes liveDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.now p { margin-top: 8px; font-size: 17px; }

.track { margin-top: 34px; }
.track__row { display: flex; align-items: center; }
.track__dot {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; font-size: 13px;
  border: 2px solid var(--line); color: var(--dim); background: var(--bg);
}
.track__dot.done { border-color: var(--accent); background: var(--accent); color: #0e1411; }
.track__dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px rgba(87,198,144,0.15); }
.track__line { flex: 1; height: 2px; background: var(--line); margin: 0 4px; }
.track__line.done { background: var(--accent); }
.track__labels { display: flex; margin-top: 10px; }
.track__labels span { flex: 1; font-size: 11.5px; color: var(--dim); text-align: center; }
.track__labels span:first-child { text-align: left; }
.track__labels span:last-child { text-align: right; }
.track__labels span.active { color: var(--text); font-weight: 600; }

.meta { margin-top: 30px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13.5px; color: var(--dim); }
.meta b { color: var(--text); font-weight: 600; }

.subscribe { margin-top: 24px; padding: 18px 20px; border-radius: 14px; background: var(--panel, rgba(255,255,255,0.03)); border: 1px solid var(--line-soft); }
.subscribe__label { display: block; font-size: 13.5px; color: var(--dim); margin-bottom: 10px; }
.subform__row { display: flex; gap: 10px; flex-wrap: wrap; }
.subform__row input { flex: 1; min-width: 180px; background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 11px 18px; font: inherit; font-size: 14.5px; color: var(--text); outline: none; }
.subform__row input:focus { border-color: var(--accent); }
.subform__row .btn { padding: 11px 20px; font-size: 14px; }
.subscribe__err { margin-top: 8px; font-size: 13px; color: #e08a6b; min-height: 0; }
.subscribe__on { font-size: 14px; color: var(--dim); }
.subscribe__on b { color: var(--text); }
.subscribe__on a { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
.subscribe__on a:hover { border-color: var(--accent); }
.subscribe__hint { margin-top: 8px; font-size: 12.5px; color: var(--dim); opacity: 0.8; }
.scope-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
.scope-opt {
  display: flex; align-items: center; gap: 0; position: relative; cursor: pointer;
  padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line);
  font-size: 14px; font-weight: 600; color: var(--dim); transition: all 160ms ease;
}
.scope-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
.scope-opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #101014; }
.scope-opt:hover { border-color: var(--accent); }

@media (max-width: 520px) {
  .subform__row .btn { flex: 1; justify-content: center; }
}

.foot { margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--line-soft); text-align: center; }
.foot p { color: var(--dim); font-size: 14px; }
.foot a { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
.foot a:hover { border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
  border: none; border-radius: 999px; padding: 13px 26px; cursor: pointer; text-decoration: none;
  background: var(--text); color: #101014; transition: transform 160ms ease, background 160ms ease;
}
.btn:hover { transform: translateY(-1px); background: #fff; }

@media (max-width: 520px) {
  .track__labels span { font-size: 10px; }
}
</style>

<nav class="nav">
  <div class="container">
    <a class="nav__inner" href="https://milezero.vercel.app">
      <svg viewBox="0 0 68 80" aria-hidden="true">
        <rect x="4" y="4" width="60" height="60" rx="10" fill="#2b6e4f" stroke="#f2f1ec" stroke-width="3.5"/>
        <text x="34" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#fff">MILE</text>
        <text x="34" y="56" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="30" fill="#fff">0</text>
        <rect x="30" y="64" width="8" height="14" rx="2" fill="#3c3c44"/>
      </svg>
      <b>Mile Zero Studio</b>
    </a>
  </div>
</nav>

<main>
  <div class="container">
    <div class="card" id="card">
      <div class="msg" id="loading">
        <p class="eyebrow">Project status</p>
        <h1>Checking in…</h1>
        <p>Pulling up where things stand.</p>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  var SHEET = '1nRGB1FDCtMgyBmg-Ag5NH4dWTGRW1QkklFT6ZZKfzqQ';
  var SHEET_HOOK = 'https://script.google.com/macros/s/AKfycbyQaJnOEywWaIlnZGlSBAIMnwkDfMqbM9uZHQg56RdLpohk5_8p0ixTB1yQg2XimVSu/exec';
  var card = document.getElementById('card');
  var params = new URLSearchParams(window.location.search);
  var initialCode = (params.get('p') || '').trim();

  var STAGES = ['Tell me what you need', 'Design & build', 'Handoff'];

  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parseCSV(text) {
    var lines = text.split(/\r?\n/);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var cells = [], m, re = /"((?:[^"]|"")*)"/g;
      while ((m = re.exec(lines[i]))) cells.push(m[1].replace(/""/g, '"'));
      if (cells.length >= 6 && cells[0].trim()) rows.push(cells);
    }
    return rows;
  }

  var pollTimer = null;

  function fetchRows() {
    // no-store + cache-busting param: never serve a stale copy of the
    // sheet, since a code created seconds ago must be findable immediately.
    return fetch('https://docs.google.com/spreadsheets/d/' + SHEET + '/gviz/tq?tqx=out:csv&_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('sheet'); return r.text(); })
      .then(parseCSV)
      .catch(function () { return null; });
  }

  function findMatch(rows, code) {
    var slug = code.toLowerCase();
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0].trim().toLowerCase() === slug) return rows[i];
    }
    return null;
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function startPolling(code) {
    stopPolling();
    pollTimer = setInterval(function () {
      fetchRows().then(function (rows) {
        if (!rows) return;
        var match = findMatch(rows, code);
        if (match) renderStatus(match);
      });
    }, 30000);
  }

  function renderEntry(prefill, error) {
    card.innerHTML =
      '<div class="msg">' +
        '<p class="eyebrow">Project status</p>' +
        '<h1>Check your project.</h1>' +
        '<p>Enter the code I gave you to see where things stand.</p>' +
        '<form class="codeform" id="codeForm">' +
          '<input id="codeInput" type="text" placeholder="Your project code" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(prefill || '') + '">' +
          '<button type="submit" class="btn" id="codeBtn">View status</button>' +
        '</form>' +
        '<p class="entry__err">' + (error ? esc(error) : '') + '</p>' +
        '<a class="btn" href="mailto:milezerostudio@gmail.com" style="margin-top:22px; background:transparent; box-shadow:inset 0 0 0 1.5px var(--line); color:var(--text);">Don\'t have a code? Email me</a>' +
      '</div>';

    document.getElementById('codeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var code = document.getElementById('codeInput').value.trim();
      if (!code) return;
      lookup(code);
    });
  }

  function lookup(code) {
    var btn = document.getElementById('codeBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
    fetchRows().then(function (rows) {
      var match = rows ? findMatch(rows, code) : null;
      if (match) {
        var realCode = match[0].trim();
        history.replaceState(null, '', '?p=' + encodeURIComponent(realCode));
        renderStatus(match);
        startPolling(realCode);
      } else {
        stopPolling();
        renderEntry(code, 'Couldn\'t find a project with that code — double-check it, or email me and I\'ll send you the right one.');
      }
    });
  }

  function renderStatus(row) {
    var name = esc(row[1]);
    var stage = parseInt(row[2], 10);
    if (!(stage >= 1 && stage <= 3)) stage = 1;
    var headline = esc(row[3]);
    var current = esc(row[4]);
    var updated = esc(row[5]);
    var next = row[6] ? esc(row[6]) : '';
    var email = row[7] ? esc(row[7].trim()) : '';
    var scope = (row[9] && row[9].trim().toLowerCase() === 'all') ? 'all' : 'milestones';

    var track = '<div class="track__row">';
    for (var i = 1; i <= 3; i++) {
      var cls = i < stage ? 'done' : (i === stage ? 'active' : '');
      track += '<div class="track__dot ' + cls + '">' + (i < stage ? '&#10003;' : i) + '</div>';
      if (i < 3) track += '<div class="track__line ' + (i < stage ? 'done' : '') + '"></div>';
    }
    track += '</div><div class="track__labels">';
    STAGES.forEach(function (label, idx) {
      track += '<span class="' + (idx + 1 === stage ? 'active' : '') + '">' + label + '</span>';
    });
    track += '</div>';

    card.innerHTML =
      '<a class="back-link" href="#" id="backLink">&larr; Check a different project</a>' +
      '<p class="eyebrow"><b>' + name + '</b></p>' +
      '<h1 class="headline">' + headline + '</h1>' +
      '<div class="sign"><small>MILE</small><b>' + stage + '</b></div>' +
      '<div class="now"><div class="label"><span class="live-dot"></span>Working on right now</div><p>' + current + '</p></div>' +
      '<div class="track">' + track + '</div>' +
      '<div class="meta"><span>Last updated: <b>' + updated + '</b></span>' +
      (next ? '<span>Next: <b>' + next + '</b></span>' : '') + '</div>' +
      '<div class="subscribe" id="subscribe">' + subscribeHTML(email, scope) + '</div>' +
      '<div class="foot"><p>Questions along the way? <a href="mailto:milezerostudio@gmail.com">Just email me</a> — no need to wait for an update.</p></div>';

    document.getElementById('backLink').addEventListener('click', function (e) {
      e.preventDefault();
      stopPolling();
      history.replaceState(null, '', window.location.pathname);
      renderEntry();
    });

    wireSubscribe(row[0].trim());
  }

  function subscribeHTML(email, scope) {
    scope = scope === 'all' ? 'all' : 'milestones';
    if (email) {
      var scopeLabel = scope === 'milestones' ? 'major milestones only' : 'every update';
      return '<p class="subscribe__on">&#10003; Getting emails at <b>' + email + '</b> (' + scopeLabel + ') · <a href="#" id="changeEmail">change</a></p>' +
        '<p class="subscribe__hint">Check your junk/spam folder if you don\'t see one — mark it "not spam" so future updates land in your inbox.</p>';
    }
    return (
      '<form class="subform" id="subForm">' +
        '<label class="subscribe__label">Want an email whenever this updates?</label>' +
        '<div class="scope-toggle">' +
          '<label class="scope-opt"><input type="radio" name="subScope" value="milestones"' + (scope === 'milestones' ? ' checked' : '') + '>Major milestones only</label>' +
          '<label class="scope-opt"><input type="radio" name="subScope" value="all"' + (scope === 'all' ? ' checked' : '') + '>Every update</label>' +
        '</div>' +
        '<div class="subform__row">' +
          '<input id="subEmail" type="email" placeholder="you@email.com" autocomplete="email" required>' +
          '<button type="submit" class="btn" id="subBtn">Email me updates</button>' +
        '</div>' +
        '<p class="subscribe__hint">Heads up — these can sometimes land in junk/spam, especially the first one.</p>' +
        '<p class="subscribe__err" id="subErr"></p>' +
      '</form>'
    );
  }

  function wireSubscribe(code) {
    var changeLink = document.getElementById('changeEmail');
    if (changeLink) {
      changeLink.addEventListener('click', function (e) {
        e.preventDefault();
        document.getElementById('subscribe').innerHTML = subscribeHTML('', '');
        wireSubscribe(code);
      });
      return;
    }
    var form = document.getElementById('subForm');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('subEmail').value.trim();
      var scope = form.querySelector('input[name="subScope"]:checked').value;
      var btn = document.getElementById('subBtn');
      var err = document.getElementById('subErr');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      err.textContent = '';
      fetch(SHEET_HOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'setEmail', code: code, email: email, scope: scope })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok) {
            document.getElementById('subscribe').innerHTML = subscribeHTML(email, scope);
            wireSubscribe(code);
          } else {
            btn.disabled = false;
            btn.textContent = 'Email me updates';
            err.textContent = 'Something went wrong — try again in a moment.';
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Email me updates';
          err.textContent = 'Something went wrong — try again in a moment.';
        });
    });
  }

  if (initialCode) {
    lookup(initialCode);
  } else {
    renderEntry();
  }
})();
</script>
